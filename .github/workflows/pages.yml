# Bouwt de site en zet haar op GitHub Pages bij elke push naar main.
# Zet in de repository: Settings > Pages > Source op "GitHub Actions".
name: Site publiceren
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
        id: pages
      # Met een eigen domein (bv. hilversumkiest.nl): zet de repository-variabele DOMEIN en laat BASIS leeg.
      # Zonder eigen domein gebruikt de bouwstap het pad van de repository.
      - run: node build.mjs
        env:
          BASIS: ${{ vars.DOMEIN && '/' || format('{0}/', steps.pages.outputs.base_path) }}
          DOMEIN: ${{ vars.DOMEIN }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
